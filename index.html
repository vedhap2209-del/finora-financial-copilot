<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finora — Think before you spend. Know before you invest.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#08080c; --bg-elev:#0e0e15; --card:#14141d; --card-hi:#191922; --card-glass: rgba(20,20,29,0.72);
  --border:rgba(255,255,255,0.08); --border-soft:rgba(255,255,255,0.05);
  --text:#f2f2f6; --text-dim:#9a99a8; --text-faint:#5c5b68;
  --violet:#8b6bff; --violet-soft:rgba(139,107,255,0.14); --violet-line:rgba(139,107,255,0.35);
  --cyan:#2fd6e8; --emerald:#33d69f; --amber:#f5a623; --red:#f0576a;
  --radius-lg:22px; --radius-md:15px; --radius-sm:10px;
  --shadow:0 12px 40px rgba(0,0,0,0.45);
  color-scheme: dark;
}
:root:not([data-theme="light"]){ }
:root[data-theme="dark"]{ }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-feature-settings:'tnum' 1; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; overflow-x:hidden;
}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#232330; border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; border-radius:6px;}

/* ============ APP SHELL ============ */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh; z-index:40;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px 10px;}
.brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg, var(--violet), var(--cyan)); display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 4px 18px rgba(139,107,255,0.4);}
.brand-text .name{font-weight:700; font-size:16.5px; letter-spacing:0.2px;}
.brand-text .tag{font-size:10.5px; color:var(--text-faint); margin-top:1px;}
.nav{display:flex; flex-direction:column; gap:2px; flex:1; margin-top:6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:var(--text-dim);
  font-size:13.6px; font-weight:500; border:1px solid transparent; transition:background .15s ease, color .15s ease;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0; opacity:0.85;}
.nav-item:hover{background:var(--card); color:var(--text);}
.nav-item.active{background:var(--violet-soft); color:#e7e1ff; border-color:var(--violet-line);}
.nav-item.active svg{opacity:1;}
.nav-divider{height:1px; background:var(--border-soft); margin:12px 6px;}
.sidebar-foot{padding:10px; border-top:1px solid var(--border-soft); margin-top:8px;}
.profile-chip{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:12px; background:var(--card);}
.avatar{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#4a4a5e,#2b2b38); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--text-dim); flex-shrink:0;}
.profile-chip .pname{font-size:12.8px; font-weight:600;}
.profile-chip .prole{font-size:10.8px; color:var(--text-faint);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:18px 34px; border-bottom:1px solid var(--border-soft);
  position:sticky; top:0; background:rgba(8,8,12,0.82); backdrop-filter:blur(14px); z-index:30;
}
.topbar-title{font-size:15px; font-weight:600;}
.topbar-actions{display:flex; align-items:center; gap:14px;}
.icon-btn{position:relative; width:36px; height:36px; border-radius:10px; background:var(--card); border:1px solid var(--border-soft); display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
.icon-btn:hover{color:var(--text); background:var(--card-hi);}
.icon-btn svg{width:16px; height:16px;}
.badge-dot{position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--red); border:2px solid var(--bg-elev);}
.view{padding:30px 34px 90px 34px; max-width:1240px;}
.hidden{display:none !important;}

/* ============ TYPOGRAPHY ============ */
h1.page-title{font-size:23px; font-weight:700; letter-spacing:-0.3px;}
.page-sub{color:var(--text-dim); font-size:13.5px; margin-top:4px;}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:0.6px; color:var(--violet); text-transform:uppercase;}
.section-gap{margin-top:30px;}

/* ============ CARDS / GRID ============ */
.grid{display:grid; gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){ .grid-3,.grid-4{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-3,.grid-4,.grid-2{grid-template-columns:1fr;} }

.card{
  background:linear-gradient(180deg, var(--card), var(--card) 60%, var(--card-hi));
  border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.card.hoverable:hover{transform:translateY(-2px); border-color:rgba(255,255,255,0.14); box-shadow:var(--shadow);}
.stat-card .label{font-size:12px; color:var(--text-dim); font-weight:500;}
.stat-card .value{font-size:26px; font-weight:700; margin-top:8px; letter-spacing:-0.4px;}
.stat-card .delta{font-size:11.8px; margin-top:6px; display:inline-flex; align-items:center; gap:4px; font-weight:600;}
.delta.up{color:var(--emerald);} .delta.down{color:var(--red);} .delta.flat{color:var(--text-faint);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 17px; border-radius:11px; font-size:13px; font-weight:600; border:1px solid transparent; transition:transform .12s ease, filter .12s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg, var(--violet), #6f4fe0); color:#fff; box-shadow:0 6px 20px rgba(139,107,255,0.28);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn-outline:hover{background:var(--card-hi);}
.btn-ghost{background:transparent; color:var(--text-dim); border:1px solid transparent; padding:8px 12px;}
.btn-ghost:hover{color:var(--text); background:var(--card);}
.btn-warn{background:rgba(245,166,35,0.14); color:var(--amber); border:1px solid rgba(245,166,35,0.35);}
.btn-danger-outline{background:transparent; color:var(--red); border:1px solid rgba(240,87,106,0.4);}
.btn-sm{padding:7px 12px; font-size:12px; border-radius:9px;}
.btn:disabled{opacity:0.45; cursor:not-allowed;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:700; letter-spacing:0.3px;}
.pill-low{background:rgba(51,214,159,0.14); color:var(--emerald);}
.pill-medium{background:rgba(245,166,35,0.14); color:var(--amber);}
.pill-high{background:rgba(240,87,106,0.14); color:var(--red);}
.pill-critical{background:rgba(240,87,106,0.22); color:#ff8a9a;}
.pill-neutral{background:var(--card-hi); color:var(--text-dim);}

.progress-track{height:8px; border-radius:20px; background:var(--card-hi); overflow:hidden; border:1px solid var(--border-soft);}
.progress-fill{height:100%; border-radius:20px; transition:width .6s cubic-bezier(.2,.8,.3,1);}
.fill-violet{background:linear-gradient(90deg, var(--violet), #b7a2ff);}
.fill-emerald{background:linear-gradient(90deg, #1fae7c, var(--emerald));}
.fill-amber{background:linear-gradient(90deg, #c9821c, var(--amber));}
.fill-red{background:linear-gradient(90deg, #c23b52, var(--red));}

/* ============ DASHBOARD ============ */
.greeting{font-size:24px; font-weight:700; letter-spacing:-0.4px;}
.greeting-sub{color:var(--text-dim); font-size:13.5px; margin-top:4px;}
.health-radial{width:104px; height:104px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;
  background:conic-gradient(var(--violet) calc(var(--pct)*1%), var(--card-hi) 0);}
.health-radial::before{content:''; position:absolute; inset:9px; border-radius:50%; background:var(--card);}
.health-radial .num{position:relative; font-size:21px; font-weight:800;}
.health-radial .num span{font-size:11px; color:var(--text-faint); font-weight:600; display:block;}
.breakdown-row{display:flex; align-items:center; gap:12px; margin-top:11px;}
.breakdown-row .lbl{width:110px; font-size:12.3px; color:var(--text-dim); flex-shrink:0;}
.breakdown-row .pct{width:38px; text-align:right; font-size:12px; font-weight:700; flex-shrink:0;}

.ask-box{
  border-radius:var(--radius-lg); padding:22px 24px; position:relative; overflow:hidden; cursor:pointer;
  background:linear-gradient(135deg, rgba(139,107,255,0.16), rgba(47,214,232,0.08)); border:1px solid var(--violet-line);
}
.ask-box::after{content:''; position:absolute; width:220px; height:220px; background:radial-gradient(circle, rgba(139,107,255,0.25), transparent 70%); top:-90px; right:-60px; pointer-events:none;}
.ask-box .ask-eyebrow{display:flex; align-items:center; gap:7px; font-weight:700; font-size:13px;}
.ask-box .ask-example{font-size:19px; font-weight:600; margin-top:10px; letter-spacing:-0.2px;}
.ask-box .ask-input-row{display:flex; align-items:center; gap:10px; margin-top:16px; background:rgba(0,0,0,0.28); border:1px solid var(--border); border-radius:13px; padding:12px 14px;}
.ask-box .ask-input-row span{color:var(--text-dim); font-size:13.5px; flex:1;}

.attn-item{display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--border-soft);}
.attn-item:last-child{border-bottom:none;}
.attn-left{display:flex; align-items:center; gap:11px;}
.attn-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.attn-text{font-size:13.4px; font-weight:500;}
.attn-sub{font-size:11.5px; color:var(--text-faint); margin-top:1px;}

/* ============ AI AGENT / CHAT ============ */
.agent-wrap{display:grid; grid-template-columns:1fr 300px; gap:20px; align-items:start;}
@media (max-width:980px){ .agent-wrap{grid-template-columns:1fr;} }
.chat-panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); display:flex; flex-direction:column; height:calc(100vh - 160px); min-height:520px;}
.chat-head{padding:18px 20px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:12px;}
.chat-head .glyph{width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--violet),var(--cyan)); display:flex; align-items:center; justify-content:center; font-size:18px;}
.chat-head .t1{font-weight:700; font-size:14.5px;}
.chat-head .t2{font-size:11.8px; color:var(--text-faint);}
.chat-body{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px;}
.msg-row{display:flex; gap:10px; max-width:100%;}
.msg-row.user{flex-direction:row-reverse;}
.msg-bubble{max-width:78%; padding:12px 15px; border-radius:16px; font-size:13.6px; line-height:1.55;}
.msg-row.user .msg-bubble{background:linear-gradient(135deg,var(--violet),#7457e8); color:#fff; border-bottom-right-radius:5px;}
.msg-row.agent .msg-bubble{background:var(--card-hi); border:1px solid var(--border-soft); border-bottom-left-radius:5px; width:100%; max-width:100%;}
.msg-avatar{width:26px; height:26px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; background:var(--card-hi); border:1px solid var(--border-soft);}
.examples-row{display:flex; flex-wrap:wrap; gap:8px; padding:4px 20px 16px 20px;}
.example-chip{font-size:12px; padding:7px 12px; border-radius:100px; background:var(--card-hi); border:1px solid var(--border-soft); color:var(--text-dim);}
.example-chip:hover{color:var(--text); border-color:var(--violet-line);}
.chat-input-row{padding:14px 16px; border-top:1px solid var(--border-soft); display:flex; gap:10px; align-items:center;}
.chat-input{flex:1; background:var(--bg-elev); border:1px solid var(--border); border-radius:13px; padding:12px 15px; color:var(--text); font-size:13.6px;}
.chat-input:focus{outline:none; border-color:var(--violet-line);}
.send-btn{width:42px; height:42px; border-radius:12px; background:linear-gradient(135deg,var(--violet),#6f4fe0); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;}

.workflow-panel{background:var(--card-hi); border:1px solid var(--border-soft); border-radius:14px; padding:14px 15px; margin:2px 0;}
.workflow-panel .wf-title{font-size:10.8px; font-weight:700; letter-spacing:0.5px; color:var(--text-faint); margin-bottom:9px;}
.wf-step{display:flex; align-items:center; gap:9px; font-size:12.3px; color:var(--text-faint); padding:4px 0; opacity:0; transform:translateY(4px); transition:opacity .35s ease, transform .35s ease, color .35s ease;}
.wf-step.show{opacity:1; transform:translateY(0);}
.wf-step.done{color:var(--text-dim);}
.wf-step .chk{width:15px; height:15px; border-radius:50%; border:1.5px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:9px;}
.wf-step.done .chk{background:var(--emerald); border-color:var(--emerald); color:#06251b;}
.wf-step.spin .chk{border-color:var(--violet); border-top-color:transparent; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.decision-card{border:1px solid var(--violet-line); border-radius:16px; padding:17px 18px; background:linear-gradient(180deg, rgba(139,107,255,0.07), transparent 40%); margin-top:2px;}
.decision-card .dc-head{display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700; letter-spacing:0.5px; color:var(--emerald); margin-bottom:10px;}
.decision-card .dc-guardian{background:var(--card); border:1px solid var(--border-soft); border-radius:13px; padding:14px 15px; margin-top:10px;}
.dc-guardian .gtitle{display:flex; align-items:center; gap:7px; font-weight:700; font-size:13px;}
.dc-guardian .gmsg{font-size:12.8px; color:var(--text-dim); margin-top:8px; line-height:1.55;}
.bar-compare{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
.bar-compare-row{display:flex; align-items:center; gap:10px;}
.bar-compare-row .bcl{width:118px; font-size:11.5px; color:var(--text-faint); flex-shrink:0;}
.bar-compare-row .bcv{width:70px; text-align:right; font-size:12px; font-weight:700; flex-shrink:0;}
.loss-table{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
.loss-row{display:flex; justify-content:space-between; font-size:12.6px; padding:8px 12px; background:var(--card); border:1px solid var(--border-soft); border-radius:9px;}
.loss-row .lp{color:var(--red); font-weight:700; width:50px;}
.analysis-grid{margin-top:12px; display:flex; flex-direction:column; gap:9px;}
.analysis-row{font-size:12.6px; line-height:1.55;}
.analysis-row b{color:var(--text); font-weight:600; display:block; font-size:11.3px; letter-spacing:0.2px; margin-bottom:2px; color:var(--text-dim);}
.dc-actions{display:flex; gap:9px; margin-top:14px; flex-wrap:wrap;}
.confidence-note{font-size:11px; color:var(--text-faint); margin-top:12px; font-style:italic;}
.freshness-tag{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--text-faint); margin-top:10px;}
.ask-details-card{border:1px solid var(--amber); border-radius:14px; padding:15px; background:rgba(245,166,35,0.06);}
.ask-details-card .adt{font-weight:700; font-size:13px; color:var(--amber); margin-bottom:8px;}
.check-item{font-size:12.6px; color:var(--text-dim); padding:4px 0;}
.mini-form{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.mini-form input{background:var(--bg-elev); border:1px solid var(--border); border-radius:9px; padding:8px 11px; color:var(--text); font-size:12.6px; flex:1; min-width:110px;}

.side-panel{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px;}
.side-panel + .side-panel{margin-top:16px;}
.side-panel h3{font-size:13px; font-weight:700; margin-bottom:12px;}
.whatif-preset{display:block; width:100%; text-align:left; font-size:12.4px; padding:10px 12px; border-radius:10px; background:var(--card-hi); border:1px solid var(--border-soft); color:var(--text-dim); margin-bottom:7px;}
.whatif-preset:hover{color:var(--text); border-color:var(--violet-line);}

/* ============ TABLES / LISTS ============ */
.list-row{display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--border-soft); gap:12px;}
.list-row:last-child{border-bottom:none;}
.tx-left{display:flex; align-items:center; gap:12px; min-width:0;}
.tx-icon{width:36px; height:36px; border-radius:10px; background:var(--card-hi); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.tx-name{font-size:13.3px; font-weight:600;}
.tx-meta{font-size:11.5px; color:var(--text-faint); margin-top:1px;}
.tx-amt{font-weight:700; font-size:13.6px; flex-shrink:0;}
.tag-cat{font-size:10.5px; padding:2px 8px; border-radius:100px; background:var(--card-hi); color:var(--text-dim); margin-left:8px;}
.row-actions{display:flex; gap:6px; opacity:0; transition:opacity .15s;}
.list-row:hover .row-actions{opacity:1;}
.icon-mini{width:26px; height:26px; border-radius:8px; background:var(--card-hi); display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:12px;}
.icon-mini:hover{color:var(--text);}

.quick-add{display:flex; gap:10px; margin-bottom:18px;}
.quick-add input{flex:1; background:var(--card); border:1px solid var(--border); border-radius:13px; padding:13px 16px; color:var(--text); font-size:13.6px;}
.quick-add input:focus{outline:none; border-color:var(--violet-line);}

.budget-card{margin-bottom:14px;}
.budget-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px;}
.budget-top .bname{font-weight:600; font-size:13.6px;}
.budget-top .bnums{font-size:12.3px; color:var(--text-dim);}
.budget-pct{font-size:11.3px; margin-top:6px; font-weight:600;}

.goal-card{position:relative;}
.goal-top{display:flex; justify-content:space-between; align-items:flex-start;}
.goal-name{font-weight:700; font-size:15px;}
.goal-deadline{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
.goal-amounts{display:flex; justify-content:space-between; margin-top:14px; font-size:12.4px; color:var(--text-dim);}
.goal-amounts b{color:var(--text); font-size:14px;}
.rescue-box{margin-top:14px; background:rgba(245,166,35,0.08); border:1px solid rgba(245,166,35,0.3); border-radius:12px; padding:12px 13px;}
.rescue-title{font-size:12.4px; font-weight:700; color:var(--amber);}
.rescue-opt{display:flex; justify-content:space-between; font-size:12px; padding:7px 0; border-top:1px solid rgba(245,166,35,0.15);}

.notif-group{margin-bottom:22px;}
.notif-group-title{font-size:11.5px; font-weight:700; letter-spacing:0.5px; color:var(--text-faint); margin-bottom:10px;}
.notif-item{display:flex; gap:12px; padding:13px; border-radius:13px; background:var(--card); border:1px solid var(--border); margin-bottom:8px;}
.notif-item .nleft{width:8px; border-radius:6px; flex-shrink:0;}
.notif-title{font-size:13px; font-weight:600;}
.notif-body{font-size:12px; color:var(--text-dim); margin-top:3px;}
.notif-time{font-size:10.8px; color:var(--text-faint); margin-top:6px;}
.notif-actions{display:flex; gap:6px; margin-top:8px;}

.decision-hist-row{padding:16px; border:1px solid var(--border); border-radius:15px; margin-bottom:12px; background:var(--card);}
.dh-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
.dh-q{font-size:13.6px; font-weight:600;}
.dh-meta{font-size:11.3px; color:var(--text-faint); margin-top:4px;}
.dh-tools{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px;}

const NAV_ITEMS = [

/* ---------------- STATE ---------------- */
const CATEGORY_ICON = {Food:'🍔', Transport:'🚕', Entertainment:'🎬', Shopping:'🛍️', Bills:'💡', Other:'📦'};
const MERCHANT_MAP = {swiggy:'Food', zomato:'Food', 'food':'Food', dining:'Food', restaurant:'Food',

  amazon:'Shopping', flipkart:'Shopping', myntra:'Shopping', shopping:'Shopping', clothes:'Shopping',
  electricity:'Bills', rent:'Bills', wifi:'Bills', broadband:'Bills', bill:'Bills', recharge:'Bills',

let state = null;
function loadState(){
  try{
    const raw = localStorage.getItem('finora_state_v1');
    if(raw){ state = JSON.parse(raw); return; }
  }catch(e){ /* storage unavailable, fall through to seed */ }
  state = seedState();
}
function saveState(){
  try{ localStorage.setItem('finora_state_v1', JSON.stringify(state)); }catch(e){ /* ignore */ }
}

/* ---------------- HELPERS ---------------- */
function fmt(n){ n = Math.round(n); return '₹' + n.toLocaleString('en-IN'); }
function fmtSigned(n){ return (n>=0?'+':'−') + fmt(Math.abs(n)); }
function uid(prefix){ state.idCounter++; return prefix+state.idCounter; }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function monthsBetween(a,b){ const d1=new Date(a), d2=new Date(b); return Math.max(0, (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth()) + (d2.getDate()>=d1.getDate()?0:-1)); }
function isThisMonth(dateStr){ const d=new Date(dateStr), n=new Date(); return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear(); }
function isLastMonth(dateStr){ const d=new Date(dateStr), n=new Date(); const lm=new Date(n.getFullYear(), n.getMonth()-1, 1); return d.getMonth()===lm.getMonth() && d.getFullYear()===lm.getFullYear(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove('show'), 2600); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ======================================================================
   DETERMINISTIC FINANCIAL CALCULATORS  (CALC) — the LLM/agent layer
   never does arithmetic itself; it only reads these outputs.
====================================================================== */
const CALC = {
  monthExpenses(month){ // month: 'this' | 'last'
    const f = month==='this' ? isThisMonth : isLastMonth;
    return state.expenses.filter(e=>f(e.date));
  },
  totalSpent(month){ return CALC.monthExpenses(month).reduce((s,e)=>s+e.amount,0); },
  byCategory(month){
    const out = {};
    CALC.monthExpenses(month).forEach(e=>{ out[e.category]=(out[e.category]||0)+e.amount; });
    return out;
  },
  budgetUtilization(){
    const spent = CALC.byCategory('this');
    return Object.keys(state.budgets).map(cat=>{
      const b = state.budgets[cat], s = spent[cat]||0;
      return {category:cat, budget:b, spent:s, pct: b>0 ? Math.round((s/b)*100) : 0};
    });
  },
  savingsRate(){
    const spent = CALC.totalSpent('this');
    const income = state.profile.monthlyIncome;
    return Math.max(0, Math.round(((income-spent)/income)*100));
  },
  monthlyRecurring(){ return state.recurring.reduce((s,r)=>s+r.amount,0); },
  availableToSpend(){
    const spent = CALC.totalSpent('this');
    return Math.max(0, state.profile.monthlyIncome - spent);
  },
  goalMonthlyRequirement(g){
    const remaining = Math.max(0, g.target - g.current);
    const months = Math.max(1, monthsBetween(new Date().toISOString().slice(0,10), g.deadline));
    return {remaining, months, monthly: Math.ceil(remaining/months)};
  },
  goalProgressPct(g){ return Math.min(100, Math.round((g.current/g.target)*100)); },
  totalGoalMonthlyNeed(){ return state.goals.reduce((s,g)=>s+CALC.goalMonthlyRequirement(g).monthly,0); },
  emergencyReservePct(){ return Math.min(100, Math.round((state.profile.emergencyReserveCurrent/state.profile.emergencyReserveTarget)*100)); },
  budgetHealthPct(){
    const rows = CALC.budgetUtilization();
    if(!rows.length) return 100;
    const avgOver = rows.reduce((s,r)=>s+Math.max(0, r.pct-100),0)/rows.length;
    return Math.max(0, Math.round(100-avgOver));
  },
  goalsHealthPct(){
    if(!state.goals.length) return 100;
    return Math.round(state.goals.reduce((s,g)=>s+CALC.goalProgressPct(g),0)/state.goals.length);
  },
  debtLoadPct(){ return state.loans.length ? 60 : 100; },
  investmentExposurePct(){ return state.investmentsHeld.length>1 ? 65 : (state.investmentsHeld.length===1?55:80); },
  financialHealthScore(){
    const e=CALC.emergencyReservePct(), b=CALC.budgetHealthPct(), g=CALC.goalsHealthPct(), d=CALC.debtLoadPct(), i=CALC.investmentExposurePct();
    return {overall:Math.round((e+b+g+d+i)/5), emergency:e, budget:b, goals:g, debt:d, investment:i};
  },
  availableInvestable(){
    const reserveBuffer = state.profile.emergencyReserveCurrent;
    const recurring = CALC.monthlyRecurring();
    const goalNeed = CALC.totalGoalMonthlyNeed();
    return Math.max(0, state.profile.currentBalance - reserveBuffer - recurring - goalNeed);
  },
  lossScenarios(amount){
    return [-10,-20,-40].map(p=>({pct:p, value: Math.round(amount*(1+p/100))}));
  },
  emi(principal, annualRatePct, months){
    const r = (annualRatePct/12)/100;
    if(r===0) return principal/months;
    const emi = principal * r * Math.pow(1+r, months) / (Math.pow(1+r, months)-1);
    return emi;
  },
  guardianCheck(amount, kind){ // kind: 'invest' | 'purchase'
    const investable = CALC.availableInvestable();
    const ratio = investable>0 ? amount/investable : (amount>0?1:0);
    let risk = 'LOW';
    if(ratio>0.6 || amount > state.profile.currentBalance) risk='CRITICAL';
    else if(ratio>0.4) risk='HIGH';
    else if(ratio>0.2) risk='MEDIUM';
    const reserveAfter = kind==='purchase' ? state.profile.emergencyReserveCurrent - Math.max(0, amount-CALC.availableToSpend()) : state.profile.emergencyReserveCurrent;
    const reserveOk = reserveAfter >= state.profile.emergencyReserveTarget*0.5;
    return {investable, ratio, risk, reserveAfter, reserveOk};
  },
  sixMonthProjection(monthlyDelta){
    const rows=[]; let bal = state.profile.currentBalance; let reserve = state.profile.emergencyReserveCurrent;
    const monthlyNet = state.profile.monthlyIncome - CALC.totalSpent('this') - CALC.monthlyRecurring()*0 ; // recurring already inside spend approx
    for(let m=1;m<=6;m++){
      bal += monthlyNet + monthlyDelta;
      rows.push({month:'M'+m, balance:Math.round(bal)});
    }
    return rows;
  }
};

/* ======================================================================
   AGENT LAYER — intent classification + tool-selection + narration
====================================================================== */
function extractAmount(text){
  const matches = text.match(/₹?\s?([\d][\d,]{2,})/g);
  if(!matches) return null;
  const nums = matches.map(m=>parseInt(m.replace(/[₹,\s]/g,''),10)).filter(n=>!isNaN(n));
  return nums.length ? Math.max(...nums) : null;
}
function extractCategory(text){
  const t = text.toLowerCase();
  for(const key in MERCHANT_MAP){ if(t.includes(key)) return {category:MERCHANT_MAP[key], merchant:key}; }
  return {category:'Other', merchant:null};
}
function extractMonths(text){
  const m = text.match(/(\d+)\s?(month|months)/i);
  if(m) return parseInt(m[1],10);
  const w = text.match(/(\d+)\s?(week|weeks)/i);
  if(w) return Math.max(1, Math.round(parseInt(w[1],10)/4));
  const y = text.match(/(\d+)\s?(year|years)/i);
  if(y) return parseInt(y[1],10)*12;
  return null;
}
function classifyIntent(text){
  const t = text.toLowerCase();
  if(/stress.?test/.test(t)) return 'STRESS_TEST';
  if(/challenge/.test(t)) return 'CHALLENGE';
  if(/why.*spend|where did my money go|spending (more|less)|spending pattern/.test(t)) return 'SPENDING_STORY';
  if(/money leak|find.*leak/.test(t)) return 'MONEY_LEAK';
  if((/spent|spend/.test(t)) && /budget/.test(t)) return 'BUDGET_ADVICE';
  if(/invest|ipo|stock|mutual fund|share/.test(t)) return 'INVESTMENT';
  if(/loan|emi|credit card|debt/.test(t)) return 'LOAN';
  if(/insurance|cover(age)?/.test(t)) return 'INSURANCE';
  if(/afford|should i buy|can i buy/.test(t)) return 'PURCHASE';
  if(/(need|save|goal|trip|wedding|fund).*(for|₹|\d)/.test(t) && (extractMonths(t) || /goal/.test(t))) return 'GOAL';
  if(/^i spent|spent ₹|spent rs\.?\s?\d/.test(t)) return 'EXPENSE';
  if(/job offer|relocat|career/.test(t)) return 'CAREER';
  return 'GENERAL';
}

const WORKFLOW_STEPS = {
  EXPENSE: ['Understanding request','Extracting expense details','Categorizing transaction','Checking for duplicates','Updating budget'],
  BUDGET_ADVICE: ['Understanding request','Retrieving recent expenses','Checking budget limits','Identifying reduction options','Generating explanation'],
  PURCHASE: ['Understanding request','Retrieving financial profile','Checking recent expenses','Checking upcoming commitments','Checking goals','Running affordability calculation','Running safety checks','Generating explanation'],
  INVESTMENT: ['Understanding request','Retrieving financial profile','Checking recent expenses','Checking goals','Checking existing portfolio','Fetching market information','Running calculations','Running safety checks','Simulating loss scenarios','Generating explanation'],
  GOAL: ['Understanding request','Retrieving financial profile','Checking savings rate','Calculating required monthly saving','Checking feasibility','Generating explanation'],
  SPENDING_STORY: ['Understanding request','Retrieving recent expenses','Analyzing category trends','Detecting anomalies','Generating explanation'],
  MONEY_LEAK: ['Understanding request','Retrieving recent expenses','Detecting recurring charges','Estimating potential savings','Generating explanation'],
  STRESS_TEST: ['Understanding request','Retrieving financial profile','Retrieving goals','Simulating income shock','Simulating expense shock','Simulating investment decline','Generating explanation'],
  LOAN: ['Understanding request','Retrieving financial profile','Calculating EMI','Calculating debt burden','Generating explanation'],
  INSURANCE: ['Understanding request','Retrieving financial profile','Checking coverage requirements','Generating explanation'],
  CAREER: ['Understanding request','Retrieving financial profile','Estimating cost of living impact','Comparing scenarios','Generating explanation'],
  GENERAL: ['Understanding request','Checking available information'],
};

let chatMsgSeq = 0;
function pushMessage(role, html, opts){
  opts = opts || {};
  const body = document.getElementById('chatBody');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role==='user'?'user':'agent');
  if(role==='user'){
    row.innerHTML = '<div class="msg-avatar">🧑</div><div class="msg-bubble">'+escapeHtml(html)+'</div>';
  } else {
    row.innerHTML = '<div class="msg-avatar">✨</div><div class="msg-bubble">'+html+'</div>';
  }
  body.appendChild(row);
  body.scrollTop = body.scrollHeight;
  return row;
}

function runAgentQuery(text){
  if(!text || !text.trim()) return;
  pushMessage('user', text);
  const intent = classifyIntent(text);
  const steps = WORKFLOW_STEPS[intent] || WORKFLOW_STEPS.GENERAL;
  const agentRow = pushMessage('agent', renderWorkflowSkeleton(steps));
  animateWorkflow(agentRow, steps, () => finalizeAgentResponse(agentRow, intent, text));
}

function renderWorkflowSkeleton(steps){
  let html = '<div class="workflow-panel"><div class="wf-title">AI WORKFLOW</div>';
  steps.forEach((s,i)=>{ html += '<div class="wf-step" data-i="'+i+'"><div class="chk"></div><span>'+s+'</span></div>'; });
  html += '</div>';
  return html;
}
function animateWorkflow(row, steps, done){
  const els = row.querySelectorAll('.wf-step');
  let i=0;
  function step(){
    if(i>0) { els[i-1].classList.remove('spin'); els[i-1].classList.add('done'); els[i-1].querySelector('.chk').textContent='✓'; }
    if(i<els.length){
      els[i].classList.add('show','spin');
      i++;
      document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
      setTimeout(step, 260);
    } else {
      setTimeout(done, 150);
    }
  }
  step();
}

function finalizeAgentResponse(row, intent, text){
  const bubble = row.querySelector('.msg-bubble');
  let extra = document.createElement('div');
  extra.innerHTML = buildAgentAnswer(intent, text);
  bubble.appendChild(extra);
  document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
}

function buildAgentAnswer(intent, text){
  switch(intent){
    case 'EXPENSE': return answerExpense(text);
    case 'BUDGET_ADVICE': return answerBudgetAdvice(text);
    case 'PURCHASE': return answerPurchase(text);
    case 'INVESTMENT': return answerInvestment(text);
    case 'GOAL': return answerGoal(text);
    case 'SPENDING_STORY': return answerSpendingStory(text);
    case 'MONEY_LEAK': return answerMoneyLeak(text);
    case 'STRESS_TEST': return answerStressTest(text);
    case 'LOAN': return answerLoan(text);
    case 'INSURANCE': return answerInsurance(text);
    case 'CAREER': return answerCareer(text);
    default: return answerGeneral(text);
  }
}

function logDecision(d){
  d.id = uid('d'); d.timestamp = new Date().toISOString();
  state.decisions.unshift(d); saveState();
}

/* ---- EXPENSE ---- */
function answerExpense(text){
  const amount = extractAmount(text) || 0;
  const {category, merchant} = extractCategory(text);
  const learned = state.learnedPrefs.merchantCategory[merchant];
  const finalCat = learned || category;
  const exp = {id:uid('e'), date:new Date().toISOString().slice(0,10), amount, category:finalCat, merchant: merchant? merchant[0].toUpperCase()+merchant.slice(1) : 'Manual entry', method:'UPI'};
  state.expenses.unshift(exp); saveState(); renderSidebarDots();
  const util = CALC.budgetUtilization().find(u=>u.category===finalCat);
  logDecision({query:text, type:'Expense', risk:'LOW', tools:['Categorizer','Budget Check'], outcome:'Logged'});
  let overNote = '';
  if(util && util.pct>=100){ overNote = '<div class="analysis-row" style="margin-top:8px; color:var(--amber);">⚠️ This puts your '+finalCat+' budget at '+util.pct+'% used ('+fmt(util.spent)+' of '+fmt(util.budget)+').</div>'; }
  return 'Logged '+fmt(amount)+' under <b>'+finalCat+'</b>'+(merchant?' ('+exp.merchant+')':'')+'. Duplicate check passed, no matching transaction in the last 24 hours.'+overNote;
}

/* ---- BUDGET ADVICE ---- */

  const {category} = extractCategory(text);

  logDecision({query:text, type:'Budget Advice', risk: over>0?'MEDIUM':'LOW', tools:['Budget Check','Category Analysis'], outcome:'Advised'});

  html += '<div class="bar-compare-row"><div class="bcl">Spent</div><div class="progress-track" style="flex:1;"><div class="progress-fill '+(util.pct>=100?'fill-red':'fill-amber')+'" style="width:'+Math.min(100,util.pct)+'%"></div></div><div class="bcv">'+fmt(util.spent)+' ('+util.pct+'%)</div></div></div>';

/* ---- PURCHASE / AFFORDABILITY ---- */

  const g = CALC.guardianCheck(amount, 'purchase');
  const avail = CALC.availableToSpend();
  const afterBal = state.profile.currentBalance - amount;
  const risk = amount > avail*1.5 ? 'HIGH' : (amount>avail ? 'MEDIUM' : 'LOW');
  logDecision({query:text, type:'Purchase', risk, tools:['Profile','Expenses','Goals','Affordability Calc','Safety Check'], outcome: risk==='HIGH'?'Flagged':'Approved with note'});
  let html = '<div class="decision-card"><div class="dc-head">🧠 ANALYSIS COMPLETE</div>';

  html += '<div class="bar-compare"><div class="bar-compare-row"><div class="bcl">Available this month</div><div class="progress-track" style="flex:1;"><div class="progress-fill fill-violet" style="width:100%"></div></div><div class="bcv">'+fmt(avail)+'</div></div>';
  html += '<div class="bar-compare-row"><div class="bcl">This purchase</div><div class="progress-track" style="flex:1;"><div class="progress-fill '+(risk==='LOW'?'fill-emerald':risk==='MEDIUM'?'fill-amber':'fill-red')+'" style="width:'+Math.min(100, Math.round(amount/Math.max(avail,1)*100))+'%"></div></div><div class="bcv">'+fmt(amount)+'</div></div></div>';
  html += '</div>';
  html += analysisBlock({
    why: risk==='LOW' ? 'This fits comfortably within your available monthly spending, with your emergency reserve and goals unaffected.' : 'This exceeds your normal available-to-spend for the month and would draw down savings earmarked for your goals.',
    dataUsed: 'Current balance, this month\'s logged expenses, active goals, recurring commitments.',
    factors: 'Available-to-spend balance, existing goal contributions, upcoming recurring bills.',
    risks: risk==='LOW' ? 'Minimal — no goal or reserve impact detected.' : 'May delay progress on '+(state.goals[0]?state.goals[0].name:'your savings goals')+' or dip into emergency reserve.',

function challengeDecision(decisionId){
  const card = document.querySelector('.decision-card[data-decision-id="'+decisionId+'"]');
  const decision = state.decisions.find(d=>d.id===decisionId) || lastDecisionRef;
  if(!card || !decision) return;
  const btn = card.querySelector('.dc-actions button');

  block.className = 'stage-block';

  document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
  setTimeout(()=>{
    const g = decision.guardian;

    const goalConflict = state.goals.length ? 'This month you are also funding '+state.goals.map(g=>g.name).join(' and ')+' — this investment competes with those contributions.' : 'No active goals currently compete for this money.';
    block.innerHTML = '<div class="stage-label">🔎 COUNTER-CHECK</div><div class="analysis-grid">'
      + '<div class="analysis-row"><b>Upcoming expenses</b>Your recurring bills total '+fmt(CALC.monthlyRecurring())+'/month and are due before this investment would be liquid again.</div>'
      + '<div class="analysis-row"><b>Concentration risk</b>'+concentration+'</div>'
      + '<div class="analysis-row"><b>Goal conflicts</b>'+goalConflict+'</div>'
      + '<div class="analysis-row"><b>Data freshness</b>Market context in this demo is illustrative, not a verified live feed — treat it as a placeholder, not fact.</div>'
      + '</div>';
    const stage2 = document.createElement('div');
    stage2.className='stage-block';
    stage2.innerHTML = '<div class="stage-label stage-active">✅ UPDATED ANALYSIS</div><div style="font-size:12.4px; color:var(--text-dim);">Weighing the counter-check…</div>';
    card.appendChild(stage2);
    document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
    setTimeout(()=>{
      const verdict = (g && (g.risk==='HIGH'||g.risk==='CRITICAL'))
        ? 'The counter-check reinforces the original caution: this stays <b style="color:var(--red)">high risk</b> given your current reserve and goal commitments. Consider a smaller amount or waiting a cycle.'
        : 'The counter-check does not surface a strong reason to avoid this — the original read holds, though the goal-timing overlap noted above is worth watching.';
      stage2.innerHTML = '<div class="stage-label">✅ UPDATED ANALYSIS</div><div style="font-size:12.6px; line-height:1.6;">'+verdict+'</div>';
      document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
    }, 900);
  }, 900);
  btn.remove();
}

/* ---- GOAL ---- */
function answerGoal(text){
  const amount = extractAmount(text);
  const months = extractMonths(text);
  if(!amount || !months) return askBeforeAssuming(['The target amount for this goal', 'Your target date or number of months', 'Anything already saved toward it'], text);
  const nameMatch = text.match(/for (?:a |the |my )?([a-zA-Z ]+?)(?: in| by|\.|$)/i);
  const name = nameMatch ? nameMatch[1].trim().replace(/^\w/,c=>c.toUpperCase()) : 'New Goal';
  const deadline = new Date(); deadline.setMonth(deadline.getMonth()+months);
  const goal = {id:uid('g'), name, target:amount, current:0, deadline:deadline.toISOString().slice(0,10), priority:'Medium'};
  state.goals.push(goal); saveState();
  const req = CALC.goalMonthlyRequirement(goal);
  const savingsAvail = Math.round(state.profile.monthlyIncome*(CALC.savingsRate()/100));
  const feasible = req.monthly <= savingsAvail*1.2;
  logDecision({query:text, type:'Goal', risk: feasible?'LOW':'MEDIUM', tools:['Profile','Savings Rate','Goal Calculator'], outcome:'Goal created'});
  let html = '<div class="decision-card"><div class="dc-head">🧠 ANALYSIS COMPLETE</div>';
  html += '<div class="dc-guardian"><div class="gtitle">🎯 '+name+' — Goal Created</div>';
  html += '<div class="gmsg">To reach '+fmt(amount)+' in '+months+' month(s), you need to save <b style="color:var(--text)">'+fmt(req.monthly)+'/month</b>.</div>';
  html += '<div class="bar-compare-row" style="margin-top:10px;"><div class="bcl">Your recent savings rate</div><div class="progress-track" style="flex:1;"><div class="progress-fill '+(feasible?'fill-emerald':'fill-amber')+'" style="width:'+Math.min(100,CALC.savingsRate())+'%"></div></div><div class="bcv">'+CALC.savingsRate()+'%</div></div>';
  html += '</div>';
  html += analysisBlock({
    why: feasible? 'This required monthly amount is close to what your recent spending pattern already allows you to save.' : 'This required monthly amount is higher than your average recent savings — it is achievable but will need a deliberate cut somewhere.',
    dataUsed: 'Monthly income, this month\'s spending, savings rate.',
    factors: 'Time horizon, current savings rate, competing goals.',
    risks: feasible ? 'Low — within your normal savings capacity.' : 'You may fall behind if spending does not decrease; see Goal Rescue options on the Goals page if that happens.',
    alternatives: 'Extend the deadline, or reduce the target amount.',
    assumptions: 'Assumes your income and average spending stay roughly the same each month.',
  });
  html += confidenceLine('High — calculation is deterministic based on your stated target and timeframe.') + '</div>';
  return html;
}

/* ---- SPENDING STORY ---- */
function answerSpendingStory(text){
  const thisM = CALC.byCategory('this'), lastM = CALC.byCategory('last');
  const totalThis = CALC.totalSpent('this'), totalLast = CALC.totalSpent('last') || totalThis;
  const pctChange = totalLast>0 ? Math.round(((totalThis-totalLast)/totalLast)*100) : 0;
  let biggestCat = 'Food', biggestDelta = -Infinity;
  Object.keys(thisM).forEach(cat=>{ const d = thisM[cat]-(lastM[cat]||0); if(d>biggestDelta){biggestDelta=d; biggestCat=cat;} });
  logDecision({query:text, type:'Spending Story', risk:'LOW', tools:['Expenses','Trend Analysis'], outcome:'Explained'});
  const foodCount = state.expenses.filter(e=>isThisMonth(e.date) && e.category==='Food').length;
  let html = '<div class="decision-card"><div class="dc-head">🧠 ANALYSIS COMPLETE</div>';
  html += '<div class="dc-guardian"><div class="gtitle">📖 Your Spending Story</div>';
  html += '<div class="gmsg">Your spending '+(pctChange>=0?'increased':'decreased')+' <b style="color:var(--text)">'+Math.abs(pctChange)+'%</b> this month compared to last.<br><br>The biggest change came from <b style="color:var(--text)">'+biggestCat+'</b>, up '+fmt(Math.max(0,biggestDelta))+' versus last month.<br><br>You logged '+foodCount+' Food transactions this month. If this trend continues, you are on track to exceed your '+biggestCat+' budget by roughly '+fmt(Math.max(0,(thisM[biggestCat]||0)-(state.budgets[biggestCat]||thisM[biggestCat]||0)))+'.</div>';
  html += '</div>' + confidenceLine('High — based on this month vs. last month\'s logged transactions.') + '<div class="dc-actions"><button class="btn btn-outline btn-sm" onclick="runAgentQuery(\'Find my money leaks\')">Find Money Leaks</button></div></div>';
  return html;
}

/* ---- STRESS TEST ---- */
function answerStressTest(text){
  const income = state.profile.monthlyIncome;
  const incomeShock = Math.round(income*0.9);
  const emergencyExpense = 15000;
  const reserveAfterShock = state.profile.emergencyReserveCurrent - emergencyExpense;
  const monthsCovered = Math.max(0, (reserveAfterShock / Math.max(1, CALC.totalSpent('this')))).toFixed(1);
  const affectedGoals = state.goals.filter(g=>CALC.goalMonthlyRequirement(g).monthly > (income-CALC.totalSpent('this'))*0.5);
  logDecision({query:text, type:'Stress Test', risk:'MEDIUM', tools:['Profile','Goals','Scenario Simulator'], outcome:'Scenario shown'});
  let html = '<div class="decision-card"><div class="dc-head">🧠 ANALYSIS COMPLETE</div>';
  html += '<div class="dc-guardian"><div class="gtitle">🧪 Financial Stress Test</div>';
  html += '<div class="gmsg">Simulated scenarios (hypothetical, not predictions):</div>';
  html += '<div class="loss-table">';
  html += '<div class="loss-row"><span>Income drops 10%</span><span>'+fmt(incomeShock)+'/mo (was '+fmt(income)+')</span></div>';
  html += '<div class="loss-row"><span>Unexpected '+fmt(emergencyExpense)+' expense</span><span>Reserve → '+fmt(reserveAfterShock)+'</span></div>';
  html += '<div class="loss-row"><span>Reserve would then cover</span><span>~'+monthsCovered+' months of spending</span></div>';
  html += '</div>';
  html += '<div class="gmsg" style="margin-top:10px;">Goals at risk under these conditions: <b style="color:var(--text)">'+(affectedGoals.length? affectedGoals.map(g=>g.name).join(', ') : 'none identified')+'</b></div>';
  html += '</div>' + analysisBlock({
    why:'These are illustrative shocks applied to your current numbers, not a forecast of what will happen.',
    dataUsed:'Current income, reserve, this month\'s spending, active goals.',
    factors:'Reserve depth, fixed recurring commitments, goal deadlines.',
    risks:'A real income drop or expense could compound with other factors not modeled here.',
    alternatives:'Increase emergency reserve target, or reduce discretionary spend to build a larger buffer.',
    assumptions:'Assumes shocks happen independently and spending pattern otherwise stays constant.',
  }) + confidenceLine('Scenario analysis, not a prediction.') + '</div>';
  return html;
}

/* ---- LOAN ---- */
function answerLoan(text){
  const amount = extractAmount(text) || 200000;
  const rate = 11; const months = 36;
  const emi = CALC.emi(amount, rate, months);
  const total = emi*months;
  logDecision({query:text, type:'Loan', risk:'MEDIUM', tools:['EMI Calculator','Debt Burden Check'], outcome:'Estimated'});
  let html = '<div class="decision-card"><div class="dc-head">🧠 ANALYSIS COMPLETE</div>';
  html += '<div class="dc-guardian"><div class="gtitle">🏦 Loan Estimate (illustrative rate: '+rate+'% p.a., '+months+' months)</div>';
  html += '<div class="loss-table">';
  html += '<div class="loss-row"><span>Principal</span><span>'+fmt(amount)+'</span></div>';
  html += '<div class="loss-row"><span>Estimated EMI</span><span>'+fmt(emi)+'/mo</span></div>';
  html += '<div class="loss-row"><span>Total repayment</span><span>'+fmt(total)+'</span></div>';
  html += '<div class="loss-row"><span>EMI as % of income</span><span>'+Math.round((emi/state.profile.monthlyIncome)*100)+'%</span></div>';
  html += '</div></div>' + confidenceLine('Illustrative — actual rate depends on your lender and credit profile.') + '</div>';
  return html;
}

/* ---- INSURANCE ---- */
function answerInsurance(text){

/* ---- GENERAL / ASK BEFORE ASSUMING ---- */
function answerGeneral(text){
  return '<div class="gmsg" style="font-size:13.4px; color:var(--text-dim);">I can help with expenses, budgets, goals, investments, purchases, loans, insurance, or a stress test — try one of the example prompts below, or tell me more about what you\'d like to check.</div>';
}
function askBeforeAssuming(items, text){
  logDecision({query:text, type:'Clarification', risk:'LOW', tools:['Intent Classifier'], outcome:'Asked for details'});
  let html = '<div class="ask-details-card"><div class="adt">I need a few details before evaluating this</div>';
  items.forEach(it=>{ html += '<div class="check-item">☐ '+it+'</div>'; });
  html += '<div class="mini-form"><input type="text" id="clarifyInput" placeholder="Add the missing details…"><button class="btn btn-primary btn-sm" onclick="submitClarify()">Provide Details</button></div></div>';
  return html;
}
function submitClarify(){
  const val = document.getElementById('clarifyInput');
  if(val && val.value.trim()) runAgentQuery(val.value.trim());
}

/* ---- shared render helpers ---- */
function analysisBlock(a){
  return '<div class="analysis-grid">'
    + '<div class="analysis-row"><b>Why</b>'+a.why+'</div>'
    + '<div class="analysis-row"><b>Data used</b>'+a.dataUsed+'</div>'
    + '<div class="analysis-row"><b>Important factors</b>'+a.factors+'</div>'
    + '<div class="analysis-row"><b>Risks</b>'+a.risks+'</div>'
    + '<div class="analysis-row"><b>Alternatives</b>'+a.alternatives+'</div>'
    + '<div class="analysis-row"><b>Assumptions</b>'+a.assumptions+'</div>'
    + '</div>';
}
function confidenceLine(text){ return '<div class="confidence-note">Confidence reflects data completeness, not a guarantee of outcome. '+text+'</div>'; }

function runWhatIf(kind, amount){
  if(kind==='wait1'){
    const projectedBalance = state.profile.currentBalance + (state.profile.monthlyIncome - CALC.totalSpent('this'));
    pushMessage('agent', '<div class="decision-card"><div class="dc-head">🧪 WHAT-IF: WAIT 1 MONTH</div><div class="dc-guardian"><div class="gtitle">Projected balance next month</div><div class="gmsg">If you wait one billing cycle, your balance would be approximately <b style="color:var(--text)">'+fmt(projectedBalance)+'</b> before this purchase — '+fmt(projectedBalance-amount)+' after it, versus '+fmt(state.profile.currentBalance-amount)+' if you buy today.</div></div></div>');
  }
}

        <div class="settings-row"><div><div class="settings-label">Emergency reserve</div><div class="settings-sub">Target: ${fmt(p.emergencyReserveTarget)}</div></div><div>${fmt(p.emergencyReserveCurrent)}</div></div>
        <div class="settings-row"><div><div class="settings-label">Risk preference</div></div><div>${p.riskPreference}</div></div>

        <div class="dc-actions" style="margin-top:12px;">
          <button class="btn btn-outline btn-sm" onclick="toast('No custom learned preferences yet in this demo session.')">View Learned Preferences</button>

function greetingWord(){ const h=new Date().getHours(); return h<12?'morning':h<17?'afternoon':'evening'; }
function healthBreakdownRow(label, pct){
  return `<div class="breakdown-row"><div class="lbl">${label}</div><div class="progress-track" style="flex:1;"><div class="progress-fill ${pct>=80?'fill-emerald':pct>=60?'fill-amber':'fill-red'}" style="width:${pct}%"></div></div><div class="pct">${pct}%</div></div>`;
}
function healthDetailRow(label, pct, sub){
  return `<div style="margin-bottom:16px;"><div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;"><span style="font-weight:600;">${label}</span><span style="font-weight:700;">${pct}%</span></div><div class="progress-track"><div class="progress-fill ${pct>=80?'fill-emerald':pct>=60?'fill-amber':'fill-red'}" style="width:${pct}%"></div></div><div style="font-size:11px; color:var(--text-faint); margin-top:5px;">${sub}</div></div>`;
}
function levelColor(l){ return l==='CRITICAL'?'var(--red)':l==='HIGH'?'var(--red)':l==='MEDIUM'?'var(--amber)':'var(--emerald)'; }
function levelDot(l){ return l==='CRITICAL'||l==='HIGH'?'🔴':l==='MEDIUM'?'🟡':'🟢'; }
function idealProgressPct(g){
  const createdMonthsAgo = g.createdMonthsAgo || 1;
  const remaining = Math.max(0, monthsBetween(new Date().toISOString().slice(0,10), g.deadline));
  const total = Math.max(1, createdMonthsAgo + remaining);
  const elapsed = createdMonthsAgo;
  return Math.min(100, Math.round((elapsed/total)*100));
}

/* ---------------- ANIMATED NUMBERS ---------------- */
function animateNumbers(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target = parseFloat(el.dataset.count);
    const suffix = el.dataset.suffix || '';
    const isCurrency = !suffix;
    let start = 0; const dur = 700; const t0 = performance.now();
    function step(t){
      const p = Math.min(1, (t-t0)/dur);
      const eased = 1-Math.pow(1-p,3);
      const val = start + (target-start)*eased;
      el.textContent = isCurrency ? fmt(val) : Math.round(val)+suffix;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* ---------------- CHAT / AGENT VIEW INIT ---------------- */
function initAgentView(){
  const body = document.getElementById('chatBody');
  body.innerHTML='';
  pushMessage('agent','Hi, I\'m Finora — your financial decision copilot. Ask me about an expense, a purchase, an investment, or a savings goal, and I\'ll walk through the analysis with you.');
}
function fillExample(text){
  const input = document.getElementById('chatInput');
  if(input){ input.value = text; input.focus(); }
}
function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value;
  if(!text.trim()) return;
  input.value='';
  runAgentQuery(text);
}

/* ---------------- EXPENSES PAGE ACTIONS ---------------- */
function submitQuickExpense(){
  const input = document.getElementById('quickExpenseInput');
  const text = input.value;
  if(!text.trim()) return;
  const amount = extractAmount(text);
  if(!amount){ toast('Include an amount, e.g. "₹500 on fuel".'); return; }
  const {category, merchant} = extractCategory(text);
  const exp = {id:uid('e'), date:new Date().toISOString().slice(0,10), amount, category, merchant: merchant? merchant[0].toUpperCase()+merchant.slice(1):'Manual entry', method:'UPI'};
  state.expenses.unshift(exp); saveState();
  input.value='';
  toast('Logged '+fmt(amount)+' under '+category+'.');
  navigate('expenses');
}
function deleteExpense(id){
  state.expenses = state.expenses.filter(e=>e.id!==id); saveState(); navigate('expenses'); toast('Expense removed.');
}
function initExpenseCharts(){
  const catData = CALC.byCategory('this');
  const cats = Object.keys(catData);
  const catCtx = document.getElementById('catChart');
  if(charts.cat) charts.cat.destroy();
  if(catCtx && cats.length){
    charts.cat = new Chart(catCtx, {
      type:'doughnut',
      data:{labels:cats, datasets:[{data:cats.map(c=>catData[c]), backgroundColor:['#8b6bff','#2fd6e8','#33d69f','#f5a623','#f0576a','#6b6b78'], borderWidth:0}]},
      options:{plugins:{legend:{position:'bottom', labels:{color:'#9a99a8', boxWidth:10, font:{size:11}}}}, cutout:'68%'}
    });
  }
  const trendCtx = document.getElementById('trendChart');
  if(charts.trend) charts.trend.destroy();
  if(trendCtx){
    const last = CALC.totalSpent('last'), thisM = CALC.totalSpent('this');
    charts.trend = new Chart(trendCtx, {
      type:'line',
      data:{labels:['Last month','This month'], datasets:[{data:[last, thisM], borderColor:'#8b6bff', backgroundColor:'rgba(139,107,255,0.15)', fill:true, tension:0.35, pointBackgroundColor:'#8b6bff'}]},
      options:{plugins:{legend:{display:false}}, scales:{x:{ticks:{color:'#9a99a8'}, grid:{color:'rgba(255,255,255,0.05)'}}, y:{ticks:{color:'#9a99a8'}, grid:{color:'rgba(255,255,255,0.05)'}}}}
    });
  }
}

/* ---------------- GOALS PAGE ACTIONS ---------------- */
function openGoalModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
      <div class="modal-head"><h3>Create Goal</h3><div class="icon-mini" onclick="closeModal()">✕</div></div>
      <div class="form-field"><label>Goal name</label><input id="gName" placeholder="e.g. Goa Trip"></div>
      <div class="form-row">
        <div class="form-field"><label>Target amount (₹)</label><input id="gTarget" type="number" placeholder="30000"></div>
        <div class="form-field"><label>Current savings (₹)</label><input id="gCurrent" type="number" placeholder="0"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Deadline</label><input id="gDeadline" type="date"></div>
        <div class="form-field"><label>Priority</label><select id="gPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:6px;" onclick="createGoal()">Create Goal</button>
    </div></div>`;
}
function createGoal(){
  const name = document.getElementById('gName').value.trim() || 'New Goal';
  const target = parseFloat(document.getElementById('gTarget').value) || 10000;
  const current = parseFloat(document.getElementById('gCurrent').value) || 0;
  const deadline = document.getElementById('gDeadline').value || (()=>{const d=new Date(); d.setMonth(d.getMonth()+6); return d.toISOString().slice(0,10);})();
  const priority = document.getElementById('gPriority').value;
  state.goals.push({id:uid('g'), name, target, current, deadline, priority});
  saveState(); closeModal(); navigate('goals'); toast('Goal "'+name+'" created.');
}
function addToGoal(id){
  const val = prompt('Add how much to this goal? (₹)','1000');
  if(val===null) return;
  const amt = parseFloat(val); if(!amt) return;
  const g = state.goals.find(g=>g.id===id); if(!g) return;
  g.current += amt; saveState(); navigate('goals'); toast('Added '+fmt(amt)+' to '+g.name+'.');
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------------- ALERTS PAGE ACTIONS ---------------- */
function markAlertRead(id){ const a=state.alerts.find(a=>a.id===id); if(a) a.read=true; saveState(); navigate('alerts'); renderSidebarDots(); }
function dismissAlert(id){ state.alerts = state.alerts.filter(a=>a.id!==id); saveState(); navigate('alerts'); renderSidebarDots(); }
function renderSidebarDots(){
  const unread = state.alerts.filter(a=>!a.read).length;
  document.getElementById('alertDot').style.display = unread ? 'block' : 'none';
}

/* ---------------- INIT ---------------- */
function buildNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = NAV_ITEMS.map(n=>`<div class="nav-item" data-view="${n.id}" onclick="navigate('${n.id}')">${ICONS[n.id]}<span>${n.label}</span></div>`).join('')
    + `<div class="nav-divider"></div><div class="nav-item" data-view="settings" onclick="navigate('settings')">${ICONS.settings}<span>Profile / Settings</span></div>`;
}
function initApp(){
  loadState();
  buildNav();
  document.getElementById('avatarInit').textContent = state.profile.name[0];
  document.getElementById('avatarInit2').textContent = state.profile.name[0];
  document.getElementById('sideProfileName').textContent = state.profile.name;
  renderSidebarDots();
  navigate('dashboard');
  setTimeout(animateNumbers, 60);
}
document.addEventListener('DOMContentLoaded', initApp);
</script>
